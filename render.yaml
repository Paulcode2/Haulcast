# Render blueprint: API web service + static frontend.
# Fill in HERE_API_KEY and the real hosts, then `render blueprint launch` or connect the repo in the dashboard.
services:
  - type: web
    name: haulcast-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: haulcast-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://haulcast-app.onrender.com
      - key: HERE_API_KEY
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://haulcast-app.onrender.com
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "true"

  - type: web
    name: haulcast-app
    runtime: static
    buildCommand: npm --prefix frontend ci && VITE_API_BASE_URL=https://haulcast-api.onrender.com npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
