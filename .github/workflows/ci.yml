name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend deps
        run: pip install -r backend/requirements.lock.txt
      - name: Django system check (deploy)
        env:
          DJANGO_SECRET_KEY: ci-insecure-secret-key-for-checks-only-0123456789abcdef
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: python backend/manage.py check --deploy
      - name: Backend tests
        env:
          DJANGO_SECRET_KEY: ci-insecure-secret-key-for-checks-only-0123456789abcdef
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: python backend/manage.py test api -v 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Frontend e2e (mocked)
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npx playwright test --grep-invert "live-trip"
